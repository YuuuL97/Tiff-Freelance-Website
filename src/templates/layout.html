<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#e5e1d9">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tiffany Jung">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta name="twitter:card" content="summary">
  {{robots}}
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23e5e1d9'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='33' fill='%23252321'%3ETJ%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{base}}assets/css/styles.css">
  <script src="{{base}}assets/js/main.js" defer></script>
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="{{base}}index.html" aria-label="Tiffany Jung — home">Tiffany Jung</a>
    </div>
  </header>
  {{main}}
  <footer class="site-footer" id="contact">
    <div class="container footer-inner">
      <a class="button" href="mailto:{{email}}">Contact me <span aria-hidden="true">⟶</span></a>
      <address class="contact-details">
        <a href="mailto:{{email}}">{{email}}</a>
        {{phones}}
        <span>{{languages}}</span>
      </address>
    </div>
  </footer>
</body>
</html>
