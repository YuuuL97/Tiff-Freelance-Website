<main class="page-main detail-page simple-detail-page" id="main">
  <article class="container">
    <a class="detail-back" href="../index.html#{{listing}}"><span aria-hidden="true">←</span> Back to {{listing}}</a>
    <header class="detail-intro">
      <p class="eyebrow">{{kind}}</p>
      <h1>{{heading}}</h1>
    </header>
    {{hero}}
    <p class="detail-description">{{description}}</p>
  </article>
</main>
